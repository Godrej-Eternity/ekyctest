<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8fbfa">
  <title>Godrej Eternity Owners' Association | Flat Owner’s e-KYC</title>
  <style>
    :root {
      --ink: #203a39;
      --teal: #146b64;
      --deep-teal: #104c48;
      --muted: #627574;
      --line: #d8e3e0;
      --bg: #eef3f1;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; }
    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--bg);
      color: var(--ink);
      font: 15px/1.4 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    /* The form scrolls inside its frame; this masthead stays in view. */
    .site-header {
      position: sticky;
      top: 0;
      z-index: 100;
      flex: 0 0 auto;
      background: #ffffff;
      border-top: 3px solid var(--teal);
      border-bottom: 1px solid var(--line);
      box-shadow: 0 3px 15px rgba(24, 64, 58, .08);
    }
    .masthead {
      max-width: 936px;
      min-height: 83px;
      margin: 0 auto;
      padding: 10px 18px;
      display: flex;
      align-items: center;
      gap: 15px;
    }
    .logo-box {
      width: 83px;
      height: 59px;
      padding: 4px;
      flex-shrink: 0;
      display: grid;
      place-items: center;
      border: 1px solid #e3ece8;
      border-radius: 9px;
      background: #fff;
    }
    .logo-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
    .brand-copy { flex: 1; min-width: 0; }
    .association {
      margin: 0 0 2px;
      font-size: 13px;
      line-height: 1.3;
      letter-spacing: .01em;
      color: var(--ink);
      font-weight: 730;
    }
    h1 {
      margin: 0;
      color: var(--teal);
      font-size: clamp(19px, 2.3vw, 23px);
      font-weight: 760;
      line-height: 1.16;
      letter-spacing: -.025em;
    }
    .subtitle {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 11.5px;
      line-height: 1.35;
    }
    .meta {
      flex: 0 0 272px;
      align-self: stretch;
      display: flex;
      flex-direction: column;
      justify-content: center;
      border-left: 1px solid var(--line);
      padding-left: 18px;
      color: var(--muted);
      font-size: 10.5px;
      line-height: 1.5;
    }
    .meta .eyebrow {
      color: var(--teal);
      letter-spacing: .105em;
      text-transform: uppercase;
      font-weight: 750;
      font-size: 9px;
      margin-bottom: 3px;
    }
    .meta .registration { color: var(--ink); font-weight: 630; }
    .content { flex: 1 1 auto; min-height: 0; }
    #survey-frame {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: var(--bg);
    }
    @media (max-width: 720px) {
      .masthead { min-height: 80px; padding: 10px 13px; gap: 11px; }
      .logo-box { width: 72px; height: 54px; }
      .meta { display: none; }
      .association { font-size: 12px; }
      h1 { font-size: 19px; }
      .subtitle { font-size: 11px; }
    }
    @media (max-width: 390px) {
      .masthead { min-height: 76px; padding: 9px 10px; gap: 9px; }
      .logo-box { width: 62px; height: 48px; padding: 3px; }
      .association { font-size: 11px; }
      h1 { font-size: 17px; }
      .subtitle { font-size: 10px; }
    }
  </style>
</head>
<body>
  <header class="site-header" aria-label="Godrej Eternity association header">
    <div class="masthead">
      <div class="logo-box">
        <img src="association-logo.png" alt="Godrej Eternity Owners' Association logo">
      </div>
      <div class="brand-copy">
        <div class="association">Godrej Eternity Owners' Association</div>
        <h1>Flat Owner’s e-KYC Form</h1>
        <p class="subtitle">Owner information and title document verification</p>
      </div>
      <div class="meta" aria-label="Association registration information">
        <div class="eyebrow">Association Services</div>
        <div class="registration">Registration No. XXXXX-XXXXX-2026</div>
        <div>Registered under Karnataka Apartment Ownership and Management Act – 2026</div>
      </div>
    </div>
  </header>
  <main class="content">
    <iframe id="survey-frame"
            title="Godrej Eternity Flat Owner’s e-KYC survey"
            referrerpolicy="no-referrer"
            loading="eager"></iframe>
  </main>
  <script>
    // Active Google Apps Script web app deployment URL.
    const APPS_SCRIPT_EXEC_URL = 'https://script.google.com/macros/s/AKfycbxAerFrrBoT4dUjskXC4spnSyidf0ws6QFYHlEeAjzuRwbx9rhpfz-HThmE5ZAuTz37/exec';
    const frame = document.getElementById('survey-frame');
    if (/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec(?:\?.*)?$/.test(APPS_SCRIPT_EXEC_URL)) {
      const url = new URL(APPS_SCRIPT_EXEC_URL);
      url.searchParams.set('embedded', '1');
      frame.src = url.toString();
    } else {
      frame.srcdoc = '<p style="font:15px system-ui;color:#203a39;padding:24px;max-width:880px;margin:18px auto;background:white;border-radius:12px">Setup needed: add the new Apps Script <strong>/exec</strong> URL to <code>APPS_SCRIPT_EXEC_URL</code> in <code>index.html</code>.</p>';
    }
  </script>
</body>
</html>
