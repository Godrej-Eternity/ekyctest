<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#104c48">
  <title>Godrej Eternity Owners' Association | Flat Owner’s e-KYC</title>
  <style>
    :root {
      --ink: #203a39;
      --teal: #146b64;
      --deep-teal: #104c48;
      --muted: #627574;
      --line: #d8e3e0;
      --bg: #eef3f1;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; }
    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--bg);
      color: var(--ink);
      font: 15px/1.4 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    /* The form scrolls inside its frame; this masthead stays in view. */
    .site-header {
      position: sticky;
      top: 0;
      z-index: 100;
      flex: 0 0 auto;
      background: linear-gradient(115deg, #104c48 0%, #17655f 56%, #227a6f 100%);
      border-bottom: 1px solid rgba(255, 255, 255, .16);
      box-shadow: 0 4px 17px rgba(12, 54, 49, .15);
    }
    .masthead {
      max-width: 936px;
      min-height: 0;
      margin: 0 auto;
      padding: 10px 18px;
      display: flex;
      align-items: center;
      gap: 38px;
    }
    .logo-box {
      width: calc(var(--brand-text-height, 103px) * 1.7474);
      height: var(--brand-text-height, 103px);
      padding: 0;
      flex-shrink: 0;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 0;
      background: transparent;
    }
    .logo-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
    .brand-copy { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; }
    .association {
      margin: 0 0 2px;
      font-size: 16px;
      line-height: 1.3;
      letter-spacing: .01em;
      color: #f6fffc;
      font-weight: 730;
    }
    h1 {
      margin: 0;
      color: #ffffff;
      font-size: clamp(22px, 2.5vw, 27px);
      font-weight: 760;
      line-height: 1.16;
      letter-spacing: -.025em;
    }
    .subtitle {
      margin: 3px 0 0;
      color: #d6e9e4;
      font-size: 12.5px;
      line-height: 1.35;
    }
    .registration-line {
      margin: 6px 0 0;
      color: #d8f0e9;
      font-size: 11px;
      line-height: 1.4;
    }
    .legal-line {
      margin: 2px 0 0;
      color: #d8f0e9;
      font-size: 10.5px;
      line-height: 1.4;
    }
    .content { flex: 1 1 auto; min-height: 0; }
    #survey-frame {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: var(--bg);
    }
    @media (max-width: 720px) {
      .masthead { min-height: 0; padding: 9px 13px; gap: 22px; }
      .registration-line, .legal-line { font-size: 9px; }
      .association { font-size: 13px; }
      h1 { font-size: 20px; }
      .subtitle { font-size: 11px; }
    }
    @media (max-width: 390px) {
      .masthead { min-height: 0; padding: 8px 10px; gap: 14px; }
      .association { font-size: 11px; }
      h1 { font-size: 17px; }
      .subtitle { font-size: 10px; }
      .legal-line { display: none; }
    }
  </style>
</head>
<body>
  <header class="site-header" aria-label="Godrej Eternity association header">
    <div class="masthead">
      <div class="logo-box">
        <img src="association-logo.png" alt="Godrej Eternity Owners' Association logo">
      </div>
      <div class="brand-copy">
        <div class="association">Godrej Eternity Owners' Association</div>
        <h1>Flat Owner’s e-KYC Form</h1>
        <p class="subtitle">Owner information and title document verification</p>
        <p class="registration-line">Registration No. XXXXX-XXXXX-2026</p>
        <p class="legal-line">Registered under Karnataka Apartment Ownership and Management Act – 2026</p>
      </div>
    </div>
  </header>
  <main class="content">
    <iframe id="survey-frame"
            title="Godrej Eternity Flat Owner’s e-KYC survey"
            referrerpolicy="no-referrer"
            loading="eager"></iframe>
  </main>
  <script>
    // Match the logo's rendered height to the entire text group at every screen size.
    const masthead = document.querySelector('.masthead');
    const brandCopy = document.querySelector('.brand-copy');
    const syncLogoHeight = () => {
      masthead.style.setProperty('--brand-text-height', brandCopy.getBoundingClientRect().height + 'px');
    };
    syncLogoHeight();
    if ('ResizeObserver' in window) new ResizeObserver(syncLogoHeight).observe(brandCopy);
    else window.addEventListener('resize', syncLogoHeight);

    // Active Google Apps Script web app deployment URL.
    const APPS_SCRIPT_EXEC_URL = 'https://script.google.com/macros/s/AKfycbxAerFrrBoT4dUjskXC4spnSyidf0ws6QFYHlEeAjzuRwbx9rhpfz-HThmE5ZAuTz37/exec';
    const frame = document.getElementById('survey-frame');
    if (/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec(?:\?.*)?$/.test(APPS_SCRIPT_EXEC_URL)) {
      const url = new URL(APPS_SCRIPT_EXEC_URL);
      url.searchParams.set('embedded', '1');
      frame.src = url.toString();
    } else {
      frame.srcdoc = '<p style="font:15px system-ui;color:#203a39;padding:24px;max-width:880px;margin:18px auto;background:white;border-radius:12px">Setup needed: add the new Apps Script <strong>/exec</strong> URL to <code>APPS_SCRIPT_EXEC_URL</code> in <code>index.html</code>.</p>';
    }
  </script>
</body>
</html>
